name: Generic LLM Remediation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_dir:
        description: 'Application Directory (e.g. applications/juice-shop)'
        required: true
        default: 'applications/juice-shop'
      target_cve:
        description: 'Target CVE ID or Package to remediate (Optional)'
        required: false
        type: string
        default: ''
jobs:
  orchestrate-remediation:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TARGET_CVE: ${{ github.event.inputs.target_cve }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Detect Ecosystem
        id: detect
        run: |
          APP_DIR="${{ github.event.inputs.app_dir }}"
          if [ -z "$APP_DIR" ]; then APP_DIR="applications/juice-shop"; fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          if [ -f "$APP_DIR/package.json" ]; then
            echo "ECOSYSTEM=npm" >> $GITHUB_ENV
          elif [ -f "$APP_DIR/pyproject.toml" ] || [ -f "$APP_DIR/requirements.txt" ]; then
            echo "ECOSYSTEM=python" >> $GITHUB_ENV
          else
            echo "ECOSYSTEM=unknown" >> $GITHUB_ENV
          fi

      - name: Setup Environment (Node/Python)
        uses: actions/setup-node@v4.0.3
        if: env.ECOSYSTEM == 'npm'
        with:
          node-version: '18.x'
          
      - name: Setup Python Environment Dependencies
        if: env.ECOSYSTEM == 'python'
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Phase 1 - Establish Baseline & Install Dependencies
        run: |
          cd ${{ env.APP_DIR }}
          if [ "$ECOSYSTEM" == "npm" ]; then
            cp ../evidence/juice_shop_package-lock.json package-lock.json || true
            npm ci 2>&1 | tee ../../dependency_install.log
          elif [ "$ECOSYSTEM" == "python" ]; then
            if [ ! -f "requirements.txt" ] && [ -f "../evidence/airflow_pip_freeze.txt" ]; then
              cp ../evidence/airflow_pip_freeze.txt requirements.txt
            fi
            pip install -r requirements.txt 2>&1 | tee ../../dependency_install.log
          fi

      - name: Phase 2 - Generate SBOM & Scan
        run: |
          cd ${{ env.APP_DIR }}
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ./bin v1.44.0
          ./bin/syft dir:. -o spdx-json > ../../baseline-sbom.json
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b ./bin v0.112.0
          GRYPE_DB_VALIDATE_AGE=false ./bin/grype sbom:../../baseline-sbom.json -o json > ../../grype.json

      - name: Phase 3 - Orchestrate Remediation (Attempt 1)
        run: |
          python scripts/remediation/generic_remediation.py $ECOSYSTEM ${{ env.APP_DIR }}

      - name: Phase 4 - Apply Fix & Verify (Phase 1 Package Manager Resolution)
        id: apply_fix
        run: |
          cd ${{ env.APP_DIR }}
          if [ "$ECOSYSTEM" == "npm" ]; then
            npm install 2>&1 | tee ../../build.log || (echo "NPM Install Failed" && exit 1)
            echo "=== Phase 4 Log: Package Installation Status ==="
            npm list --depth=0 || true
          elif [ "$ECOSYSTEM" == "python" ]; then
            pip install --no-deps -r requirements.txt 2>&1 | tee ../../build.log || (echo "PIP Install Failed" && exit 1)
            echo "=== Phase 4 Log: Package Installation Status ==="
            pip show redshift-connector || pip show flask || true
            echo "=== Updated requirements.txt ==="
            grep -iE "redshift-connector|flask" requirements.txt || true
          fi

      - name: Phase 5 - Fallback Lockfile Regeneration (Phase 2 Package Manager Resolution)
        if: failure()
        run: |
          cd ${{ env.APP_DIR }}
          echo "Native package manager resolution retained stale dependency metadata or failed. Forcing a documented clean dependency graph regeneration."
          if [ "$ECOSYSTEM" == "npm" ]; then
            rm -f package-lock.json
            rm -rf node_modules
            npm install 2>&1 | tee ../../build.log
          elif [ "$ECOSYSTEM" == "python" ]; then
            rm -f requirements.txt
            pip install -e . 2>&1 | tee ../../build.log
          fi
          if [ -f ../../metrics.json ]; then
            sed -i 's/"lockfile_regenerated": false/"lockfile_regenerated": true/' ../../metrics.json
          fi

      - name: Phase 6 - Build / Tests / Rescan
        id: build_test
        run: |
          cd ${{ env.APP_DIR }}
          echo "Validating application functionality..." 2>&1 | tee -a ../../build.log
          if [ "$ECOSYSTEM" == "npm" ]; then
            if jq -e '.scripts["build:frontend"]' package.json > /dev/null 2>&1; then npm run build:frontend 2>&1 | tee -a ../../build.log; fi
            if jq -e '.scripts["build:server"]' package.json > /dev/null 2>&1; then npm run build:server 2>&1 | tee -a ../../build.log; fi
            if jq -e '.scripts["build"]' package.json > /dev/null 2>&1; then npm run build 2>&1 | tee -a ../../build.log; fi
            if jq -e '.scripts["test"]' package.json > /dev/null 2>&1; then 
              npm test 2>&1 | tee ../../test.log || true
              echo "=== Phase 6 Log: Test Execution Summary ==="
              tail -n 25 ../../test.log || true
            fi
          elif [ "$ECOSYSTEM" == "python" ]; then
            if [ -f "pytest.ini" ] || [ -d "tests" ]; then 
              pytest 2>&1 | tee ../../test.log || true
              echo "=== Phase 6 Log: Test Execution Summary ==="
              tail -n 25 ../../test.log || true
            fi
          fi
          
          ./bin/syft dir:. -o spdx-json > ../../post-sbom.json
          GRYPE_DB_VALIDATE_AGE=false ./bin/grype sbom:../../post-sbom.json -o json > ../../rescan.json
          echo "=== Phase 6 Log: Post-Remediation Scan Status ==="
          python -c "import json; data=json.load(open('../../rescan.json')); print('Remaining Vulnerabilities:', len(data.get('matches', [])))" || true
          python ../../scripts/remediation/validator.py ../../rescan.json $(jq -r '.selected_cve' ../../metrics.json) ../../metrics.json

      - name: Update Metrics on Build Failure
        if: failure() && steps.build_test.conclusion == 'failure'
        run: |
          if [ -f metrics.json ]; then
            jq '.build_success = false | .failure_stage = "build" | .validation_stage_reached = "build"' metrics.json > metrics.tmp && mv metrics.tmp metrics.json
          fi

      - name: Update Metrics on Apply Fix Failure
        if: failure() && steps.apply_fix.conclusion == 'failure'
        run: |
          if [ -f metrics.json ]; then
            jq '.build_success = false | .failure_stage = "apply_fix" | .validation_stage_reached = "apply_fix"' metrics.json > metrics.tmp && mv metrics.tmp metrics.json
          fi

      - name: Phase 7 - Retry Orchestration (Attempt 2)
        if: failure()
        run: |
          echo "Failure detected. Capturing logs and performing Retry Iteration."
          if [ "$ECOSYSTEM" == "python" ]; then
            cd ${{ env.APP_DIR }}
            cp ../evidence/airflow_pip_freeze.txt requirements.txt
            cd ../..
          fi

          if [ -f scripts/remediation/retry_remediation.py ]; then
            python scripts/remediation/retry_remediation.py $ECOSYSTEM ${{ env.APP_DIR }} build
          fi
          
          cd ${{ env.APP_DIR }}
          if [ "$ECOSYSTEM" == "npm" ]; then
            rm -f package-lock.json
            rm -rf node_modules
            npm install 2>&1 | tee ../../build.log
          elif [ "$ECOSYSTEM" == "python" ]; then
            pip install --no-deps -r requirements.txt 2>&1 | tee ../../build.log || true
          fi
          ./bin/syft dir:. -o spdx-json > ../../post-sbom.json
          GRYPE_DB_VALIDATE_AGE=false ./bin/grype sbom:../../post-sbom.json -o json > ../../rescan.json
          if [ -f ../../metrics.json ]; then
            python ../../scripts/remediation/validator.py ../../rescan.json $(jq -r '.selected_cve' ../../metrics.json) ../../metrics.json
          fi

      - name: Evidence Collection
        if: always()
        run: |
          mkdir evidence
          mv baseline-sbom.json evidence/ || true
          mv grype.json evidence/baseline-grype.json || true
          mv candidate-ranking.json evidence/ || true
          mv selected-candidate.json evidence/ || true
          mv llm-request.json evidence/ || true
          mv llm-response.json evidence/ || true
          mv build.log evidence/ || true
          mv test.log evidence/ || true
          mv rescan.json evidence/ || true
          mv metrics.json evidence/ || true
          mv package-before.json evidence/ || true
          mv package-after.json evidence/ || true
          
          python scripts/remediation/generate_manifest.py

      - name: Upload Evidence Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-evidence
          path: evidence/
