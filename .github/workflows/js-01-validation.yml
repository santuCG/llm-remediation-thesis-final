name: JS-01 End-to-End Orchestration (12 Phases)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  orchestrate-js-01:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    defaults:
      run:
        working-directory: applications/juice-shop

    steps:
      # ==========================================
      # BASELINE PHASES
      # ==========================================
      - name: Phase 1 - Checkout Code
        uses: actions/checkout@v4.1.7
      
      - name: Phase 1 - Setup Node.js 18.x
        uses: actions/setup-node@v4.0.3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: applications/juice-shop/package-lock.json

      - name: Phase 2 - Establish Baseline (npm ci)
        run: |
          # Copy the deterministic baseline lockfile from evidence
          cp ../evidence/juice_shop_package-lock.json package-lock.json
          npm ci

      - name: Phase 3 - Build Baseline
        run: |
          echo "Build runs during postinstall"

      - name: Phase 4.A - Generate Baseline SBOM (Syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.44.0
          syft dir:. -o spdx-json > baseline-sbom.json
          echo "=== SBOM GENERATED: applications/juice-shop/baseline-sbom.json ==="

      - name: Phase 4.B - Scan Baseline (Check for CVE-2023-32314)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.112.0
          GRYPE_DB_VALIDATE_AGE=false grype sbom:baseline-sbom.json -o json > grype.json || true
          echo "=== GRYPE SCAN COMPLETED: applications/juice-shop/grype.json ==="
          echo "--- CVE-2023-32314 MATCH OBJECT ---"
          jq -e '.matches[] | select(.vulnerability.id == "GHSA-whpj-8f3w-67p5" or .vulnerability.id == "CVE-2023-32314" or (.relatedVulnerabilities[]?.id == "CVE-2023-32314"))' grype.json || true
          echo "-----------------------------------"
          if jq -e '.matches[] | select(.vulnerability.id == "GHSA-whpj-8f3w-67p5" or .vulnerability.id == "CVE-2023-32314" or (.relatedVulnerabilities[]?.id == "CVE-2023-32314"))' grype.json > /dev/null; then
            echo "Vulnerability found!"
            exit 0
          else
            echo "Vulnerability NOT found!"
            exit 1
          fi

      # ==========================================
      # SCANNER / NAIVE REMEDIATION PHASES
      # ==========================================
      - name: Phase 5 - Apply Scanner Fix (Direct Bump to 3.9.19)
        id: scanner_fix
        run: |
          npm install vm2@3.9.19

      - name: Phase 6 - Build with Scanner Fix
        run: |
          echo "Build runs during postinstall"

      - name: Phase 7 - Scan after Scanner Fix
        run: |
          syft dir:. -o spdx-json > scanner-sbom.json
          echo "=== SBOM GENERATED: applications/juice-shop/scanner-sbom.json ==="
          GRYPE_DB_VALIDATE_AGE=false grype sbom:scanner-sbom.json -o json > grype-scanner.json || true
          echo "=== GRYPE SCAN COMPLETED: applications/juice-shop/grype-scanner.json ==="
          echo "--- CVE-2023-32314 MATCH OBJECT ---"
          jq -e '.matches[] | select(.vulnerability.id == "GHSA-whpj-8f3w-67p5" or .vulnerability.id == "CVE-2023-32314" or (.relatedVulnerabilities[]?.id == "CVE-2023-32314"))' grype-scanner.json || true
          echo "-----------------------------------"

      - name: Assert Scanner Failure (Expected)
        run: |
          if jq -e '.matches[] | select(.vulnerability.id == "GHSA-whpj-8f3w-67p5" or .vulnerability.id == "CVE-2023-32314" or (.relatedVulnerabilities[]?.id == "CVE-2023-32314"))' grype-scanner.json > /dev/null; then
            echo "The naive scanner update was applied and exited with code 0, but Grype rescanned the lockfile and the nested CVE is still active." > ../../pipeline_failure_context.txt
            echo "Phase 5 failed to eradicate the vulnerability. Pipeline failure context exported."
            # Reset package files for the LLM phase
            git restore package.json
            cp ../evidence/juice_shop_package-lock.json package-lock.json
            npm ci
          else
            echo "Scanner fix eradicated the vulnerability unexpectedly."
            exit 1
          fi

      # ==========================================
      # LLM REMEDIATION PHASES
      # ==========================================
      - name: Phase 8 & 9 - Invoke LLM Layer & Apply Fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ../../scripts/gemini_remediation.py
          npm install

      - name: Phase 10 - Build with LLM Fix
        run: |
          echo "Build runs during postinstall"

      - name: Phase 11.A - Generate LLM SBOM
        run: |
          syft dir:. -o spdx-json > llm-sbom.json
          echo "=== SBOM GENERATED: applications/juice-shop/llm-sbom.json ==="

      - name: Phase 11.B - Scan LLM Remediated Code
        run: |
          GRYPE_DB_VALIDATE_AGE=false grype sbom:llm-sbom.json -o json > grype-llm.json || true
          echo "=== GRYPE SCAN COMPLETED: applications/juice-shop/grype-llm.json ==="
          echo "--- CVE-2023-32314 MATCH OBJECT ---"
          jq -e '.matches[] | select(.vulnerability.id == "GHSA-whpj-8f3w-67p5" or .vulnerability.id == "CVE-2023-32314" or (.relatedVulnerabilities[]?.id == "CVE-2023-32314"))' grype-llm.json || echo "No CVE found! Completely eradicated."
          echo "-----------------------------------"

      - name: Phase 12 - Final Verification (Assert Eradication)
        run: |
          if jq -e '.matches[] | select(.vulnerability.id == "GHSA-whpj-8f3w-67p5" or .vulnerability.id == "CVE-2023-32314" or (.relatedVulnerabilities[]?.id == "CVE-2023-32314"))' grype-llm.json > /dev/null; then
            echo "FAILED: CVE-2023-32314 is still present! The LLM failed to remediate the vulnerability."
            exit 1
          else
            echo "SUCCESS: CVE-2023-32314 has been eradicated. The LLM provided a valid resolution strategy."
          fi

      - name: Phase 13 - Runtime Sanity Check
        run: |
          npm start &
          SERVER_PID=$!
          sleep 15
          curl -f http://localhost:3000
          kill $SERVER_PID
