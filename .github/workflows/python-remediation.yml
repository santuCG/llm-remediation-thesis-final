name: Python Remediation Template

on:
  workflow_call:
    inputs:
      scenario:
        description: 'Scenario ID'
        required: true
        type: string

jobs:
  python-remediation:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Parse Profile
        run: |
          pip install pyyaml
          python scripts/profiles/load_profile.py profiles/${{ inputs.scenario }}.yaml

      - name: Initialize Environment
        uses: actions/setup-python@v5.1.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config gcc

      - name: Cache Syft and Grype
        id: cache-tools
        uses: actions/cache@v3
        with:
          path: ./bin
          key: ${{ runner.os }}-syft-${{ env.SYFT_VERSION }}-grype-${{ env.GRYPE_VERSION }}
          
      - name: Install Syft and Grype
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./bin
          SYFT_NO_V=${SYFT_VERSION#v}
          curl -sSfL -o syft.tar.gz https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_NO_V}_linux_amd64.tar.gz || \
          curl -sSfL -o syft.tar.gz https://github.com/anchore/syft/releases/download/v1.44.0/syft_1.44.0_linux_amd64.tar.gz
          tar -xzf syft.tar.gz -C ./bin syft
          
          GRYPE_NO_V=${GRYPE_VERSION#v}
          curl -sSfL -o grype.tar.gz https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_NO_V}_linux_amd64.tar.gz || \
          curl -sSfL -o grype.tar.gz https://github.com/anchore/grype/releases/download/v0.112.0/grype_0.112.0_linux_amd64.tar.gz
          tar -xzf grype.tar.gz -C ./bin grype

      - name: Install Baseline Dependencies
        run: |
          cd ${{ env.APP_DIR }}
          if [ "$RESTORE_LOCKFILE" = "true" ]; then
            cp ../../$LOCKFILE_SOURCE requirements.txt || true
          fi
          pip install -r requirements.txt 2>&1 | tee ../../dependency_install.log

      - name: Generate SBOM & Run Grype
        run: |
          cd ${{ env.APP_DIR }}
          ../../bin/syft dir:. --exclude "**/bin" --exclude "**/build" --exclude "**/.eggs" --exclude "**/*.egg-info" --exclude "**/dist" --exclude "**/.pytest_cache" -o spdx-json > ../../baseline-sbom.json
          GRYPE_DB_VALIDATE_AGE=false ../../bin/grype sbom:../../baseline-sbom.json -o json > ../../grype.json

      - name: Determine Remediation Strategy
        run: |
          python scripts/remediation/generic_remediation.py python ${{ env.APP_DIR }}

      - name: Apply Fix & Verify
        id: apply_fix
        run: |
          set -o pipefail
          cd ${{ env.APP_DIR }}
          pip install -r requirements.txt 2>&1 | tee ../../build.log || (echo "Pip Install Failed" && exit 1)
          echo "=== Phase 4 Log: Package Installation Status ==="
          pip freeze || true

      - name: Fallback Lockfile Regeneration
        if: failure()
        run: |
          cd ${{ env.APP_DIR }}
          echo "Native package manager resolution retained stale dependency metadata or failed. Forcing a documented clean dependency graph regeneration."
          pip install pipreqs
          pipreqs . --force
          pip install -r requirements.txt 2>&1 | tee ../../build.log
          if [ -f ../../metrics.json ]; then
            sed -i 's/"lockfile_regenerated": false/"lockfile_regenerated": true/' ../../metrics.json
          fi

      - name: Validate Remediation & Rescan
        id: build_test
        if: always()
        run: |
          cd ${{ env.APP_DIR }}
          echo "Validating application functionality..." 2>&1 | tee -a ../../build.log
          
          # Read build array
          BUILD_CMDS=$(python -c "import yaml; print('\n'.join(yaml.safe_load(open('../../profiles/${{ inputs.scenario }}.yaml'))['validation'].get('build', [])))")
          if [ -n "$BUILD_CMDS" ]; then
            while IFS= read -r cmd; do
              echo "Running $cmd"
              bash -c "$cmd" 2>&1 | tee -a ../../build.log || (jq '.build_success = false' ../../metrics.json > tmp.json && mv tmp.json ../../metrics.json && exit 1)
            done <<< "$BUILD_CMDS"
          fi
          
          # Read test array
          TEST_CMDS=$(python -c "import yaml; print('\n'.join(yaml.safe_load(open('../../profiles/${{ inputs.scenario }}.yaml'))['validation'].get('test', [])))")
          if [ -n "$TEST_CMDS" ]; then
            while IFS= read -r cmd; do
              echo "Running $cmd"
              bash -c "$cmd" 2>&1 | tee -a ../../test.log
              TEST_EXIT=${PIPESTATUS[0]}
              if [ "$TEST_EXIT" -eq 0 ]; then
                jq '.test_success = true' ../../metrics.json > tmp.json && mv tmp.json ../../metrics.json
              else
                jq '.test_success = false' ../../metrics.json > tmp.json && mv tmp.json ../../metrics.json
              fi
            done <<< "$TEST_CMDS"
          fi
          
          ../../bin/syft dir:. --exclude "**/bin" --exclude "**/build" --exclude "**/.eggs" --exclude "**/*.egg-info" --exclude "**/dist" --exclude "**/.pytest_cache" -o spdx-json > ../../post-sbom.json
          GRYPE_DB_VALIDATE_AGE=false ../../bin/grype sbom:../../post-sbom.json -o json > ../../rescan.json
          echo "=== Post-Remediation Scan Status ==="
          python -c "import json; data=json.load(open('../../rescan.json')); print('Remaining Vulnerabilities:', len(data.get('matches', [])))" || true
          python ../../scripts/remediation/validator.py ../../rescan.json $(jq -r '.selected_cve' ../../metrics.json) ../../metrics.json

      - name: Golden Validation
        if: always()
        run: |
          python scripts/remediation/golden_validation.py profiles/${{ inputs.scenario }}.yaml metrics.json || true

      - name: Update Metrics on Build Failure
        if: failure() && steps.build_test.conclusion == 'failure'
        run: |
          if [ -f metrics.json ]; then
            jq '.build_success = false | .failure_stage = "build" | .validation_stage_reached = "build"' metrics.json > metrics.tmp && mv metrics.tmp metrics.json
          fi

      - name: Update Metrics on Apply Fix Failure
        if: failure() && steps.apply_fix.conclusion == 'failure'
        run: |
          if [ -f metrics.json ]; then
            jq '.build_success = false | .failure_stage = "apply_fix" | .validation_stage_reached = "apply_fix"' metrics.json > metrics.tmp && mv metrics.tmp metrics.json
          fi

      - name: Retry Remediation Strategy
        if: failure()
        run: |
          echo "Failure detected. Capturing logs and performing Retry Iteration."
          cd ${{ env.APP_DIR }}
          cp ../../requirements-before.txt requirements.txt
          cd ../..

          if [ -f scripts/remediation/retry_remediation.py ]; then
            python scripts/remediation/retry_remediation.py python ${{ env.APP_DIR }} build
          fi
          
          cd ${{ env.APP_DIR }}
          pip install pipreqs
          pipreqs . --force
          pip install -r requirements.txt 2>&1 | tee ../../build.log
          ../../bin/syft dir:. --exclude "**/bin" --exclude "**/build" --exclude "**/.eggs" --exclude "**/*.egg-info" --exclude "**/dist" --exclude "**/.pytest_cache" -o spdx-json > ../../post-sbom.json
          GRYPE_DB_VALIDATE_AGE=false ../../bin/grype sbom:../../post-sbom.json -o json > ../../rescan.json
          if [ -f ../../metrics.json ]; then
            python ../../scripts/remediation/validator.py ../../rescan.json $(jq -r '.selected_cve' ../../metrics.json) ../../metrics.json
          fi

      - name: Gather Evidence
        if: always()
        run: |
          mkdir evidence
          mv baseline-sbom.json evidence/ || true
          mv grype.json evidence/baseline-grype.json || true
          mv candidate-ranking.json evidence/ || true
          mv selected-candidate.json evidence/ || true
          mv llm-request.json evidence/ || true
          mv llm-response.json evidence/ || true
          mv build.log evidence/ || true
          mv test.log evidence/ || true
          mv rescan.json evidence/ || true
          mv metrics.json evidence/ || true
          mv requirements-before.txt evidence/ || true
          mv requirements-after.txt evidence/ || true
          mv validation-report.json evidence/ || true
          
          python scripts/remediation/generate_manifest.py

      - name: Generate Pipeline Reports
        if: always()
        run: |
          python scripts/pipeline/generate_reports.py profiles/${{ inputs.scenario }}.yaml evidence

      - name: Build Provenance Bundle
        if: always()
        run: |
          mkdir provenance
          cp profiles/${{ inputs.scenario }}.yaml provenance/profile.yaml || true
          cp .github/workflows/python-remediation.yml provenance/workflow.yml || true
          cp evidence/scenario-manifest.json provenance/manifest.json || true
          cp evidence/pipeline-summary.json provenance/pipeline-summary.json || true
          cp ${{ env.APP_DIR }}/requirements.txt provenance/requirements.txt || true
          python scripts/evidence/build_environment.py

      - name: Upload Remediation Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SCENARIO_ID }}-llm-${{ github.run_id }}
          path: |
            evidence/
            provenance/
