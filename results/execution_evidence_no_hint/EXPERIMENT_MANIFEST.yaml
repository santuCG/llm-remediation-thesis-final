Experiment:
  Name: Hint Removal Ablation
  Branch: research/hint-removal-ablation
  Workflow: Research - Hint Removal Ablation
  Prompt Configuration: HintRemoval-v1.0
  Base Commit: 3e1173860e0a9121a0d473f4c77f069cfee9adf5
  Status: In progress -- JS-05, JS-09, and AF-01 done (JS-09's first dispatch was contaminated
    by a retry-path leak, see "Known Issue" below; fixed and rerun clean). JS-01 in progress,
