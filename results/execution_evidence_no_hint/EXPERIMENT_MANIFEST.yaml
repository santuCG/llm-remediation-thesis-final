Experiment:
  Name: Hint Removal Ablation
  Branch: research/hint-removal-ablation
  Workflow: Research - Hint Removal Ablation
  Prompt Configuration: HintRemoval-v1.0
  Base Commit: 3e1173860e0a9121a0d473f4c77f069cfee9adf5
  Status: In progress -- JS-05 verified clean; JS-09 contaminated (retry-path leak, see
    "Known Issue" below), fix applied, rerun queued

Independent Variable:
  Fixed version hint: removed (scripts/remediation/llm_reasoner.py, "Fixed Versions" line deleted from user_prompt)

Controls (unchanged from base pipeline):
  Model: Gemini 3.6-flash, with documented fallback list
  Temperature: 0.0
  Schema: unchanged (recommended_package_version remains a required field)
  Validator: unchanged (scripts/remediation/validator.py)
  Retry: unchanged (one retry, build-error feedback)
  Registry validation: unchanged

Known Issue -- Fixed-Version Leak via Retry Path (found and fixed after JS-05, JS-09):
  Cause: retry_remediation.py's _extract_rescan_summary() independently appended
    "Scanner-known fixed versions: [...]" to the retry's failure-context block whenever
    attempt 1's rescan ran and still detected the target CVE. This is a second,
    separate prompt-construction path that llm_reasoner.py's hint removal never touched.
  Trigger condition: only fires when attempt 1 gets far enough to run a rescan that still
    detects the CVE (test installs but doesn't fix it) -- not when attempt 1 fails earlier
    (e.g. at apply_fix, before rescan ever runs).
  Scope, verified directly against each scenario's actual retry prompt text (not inferred):
    JS-05: CLEAN. Attempt 1 failed at apply_fix, before rescan ever ran -- no rescan.json
      entry existed for _extract_rescan_summary to find, confirmed by grepping the actual
      llm-request.json retry prompt (no match).
    JS-09: CONTAMINATED. Attempt 1 reached a rescan that still detected the CVE, so the
      retry prompt received "Scanner-known fixed versions: ['2.1.1']" verbatim -- the same
      fix version the base pipeline's hint would have given. JS-09's "Correct" final
      outcome does not constitute evidence of unaided recovery and must be re-run before
      being used in any analysis. Evidence retained under
      results/execution_evidence_no_hint/JS-09/ for transparency, not deleted, but flagged
      contaminated and excluded from findings until rerun.
  Fix applied: retry_remediation.py's rescan-context message now reports only that the CVE
    is still detected (package/version), with the fixed-versions clause removed. The
    build-error-log retry path (_extract_build_errors) was not affected and needed no change.
  Action: JS-09 queued for rerun under the fixed code before proceeding to JS-01/AF-01.

Dependent Variables:
  Recommended version
  Strategy
  Rationale length (word count of `reasoning`, objective proxy -- not a self-reported confidence score)
  Reasoning category (manual coding, pending; starter taxonomy: cites external advisory (GHSA/NVD) /
    cites semver "first patched version" heuristic / cites changelog or release notes /
    generic-unspecified / hedged-uncertain)
  Outcome decomposition (replaces a single flat outcome label -- separates reasoning quality from
    pipeline/retry recovery, since these are two distinct mechanisms that a single "final outcome"
    field confounds):
    First attempt: Correct / Incorrect
      (Incorrect = wrong dependency-type reasoning, wrong strategy, hallucinated version, or a
      pipeline-level failure before reaching rescan -- read failure_stage/validation_stage_reached
      on metrics-attempt1.json to distinguish these, don't infer from rescan_success alone since a
      pipeline failure before rescan also reads rescan_success=false with no rescan having occurred)
    Retry used: Yes / No
    Final outcome: Correct / Incorrect
    Version published: Yes / No (checked directly against the registry, not inferred from
      dependency_verified alone)
    Rescan passed: Yes / No
    Manual review flag: Yes / No (tracked separately -- strategy == manual_review at either attempt;
      not collapsible into Correct/Incorrect since refusal is not a version-correctness claim)
  Reasoning materially different from hinted baseline (Y/N, qualitative)

Pilot Protocol (JS-05 only, gate before running remaining scenarios):
  Q1: Is recommended_package_version semantically meaningful (not just present -- schema requires
      the field regardless of strategy, so presence alone is not informative)?
  Q2: Does the version exist on the registry?
  Q3: Does rescan_success confirm the CVE is resolved?
  Q4: Is the reasoning materially different from the hinted-run baseline below?

Hinted Baseline (JS-05, for Q4 comparison):
  Source: results/execution_evidence/JS-05/llm-response.json
  Strategy: direct_upgrade
  Version: 4.2.2
  Reasoning: >
    jsonwebtoken is declared as a direct dependency in package.json at version 0.4.0, which is
    affected by GHSA-c7hr-j4mj-j2w6. Upgrading jsonwebtoken directly to version 4.2.2 resolves the
    vulnerability. Direct Upgrade is the optimal strategy because the package is directly defined
    in package.json dependencies.

Evidence:
  Full rendered prompt: captured in llm-request.json per scenario (same convention as base pipeline;
    verified sufficient, no separate prompt.txt needed)
  Output path: results/execution_evidence_no_hint/<SCENARIO_ID>/

Scenarios:
  Pilot: JS-05
  Dropped: JS-07 (excluded from this experiment by explicit decision)
  Sequential order (one at a time, not parallel): JS-09 (contaminated, queued for rerun
    under fixed code), JS-01, AF-01

Pilot Result (JS-05):
  Run: https://github.com/santuCG/llm-remediation-thesis-final/actions/runs/31217244426
  Job conclusion: failure (known job-level pattern -- Apply Fix & Verify fails on attempt 1,
    Fallback Lockfile Regeneration + Retry Remediation Strategy succeed; matches the base
    pipeline's own historical JS-05 job-level-failure/remediation-actually-succeeded pattern,
    not a new anomaly)
  Attempt 1: strategy=transitive_override, version=9.0.0, dependency_verified=false
    (misdiagnosed jsonwebtoken as transitive via express-jwt@0.1.3; same misdiagnosis pattern
    as the original hinted run's attempt 1, reproduced independently of the hint -- n=1, not
    generalized)
  Retry (final): strategy=direct_upgrade, version=9.0.2, dependency_verified=true,
    rescan_success=true, retry_count=1
  Rationale length: 83 words (attempt 1), 78 words (final) -- vs. 41 words for the hinted
    baseline's equivalent reasoning
  Q1 (semantically meaningful version?): Yes -- "9.0.2", well-formed, consistent with
    strategy=direct_upgrade
  Q2 (published on registry?): Yes -- verified directly against the npm registry
    (registry.npmjs.org/jsonwebtoken/9.0.2), published 2023-08-29
  Q3 (resolves the CVE?): Yes -- rescan_success=true
  Q4 (reasoning materially different from hinted baseline?): Mixed. The strategy-selection
    reasoning ("directly declared in package.json at version 0.4.0" -> direct_upgrade) is
    nearly identical in form to the hinted baseline. The recommended version differs
    substantially (9.0.2 vs. the hinted 4.2.2 -- five major versions apart), but neither the
    hinted nor unhinted reasoning explains *how* the specific version number was derived --
    both assert it rather than justify it. This is itself informative: removing the hint
    changed the answer and lengthened the reasoning, but did not, on this one scenario,
    produce an explicit justification for the version choice in either condition.
  Outcome decomposition:
    First attempt: Incorrect (failure_stage=apply_fix, validation_stage_reached=apply_fix --
      failed before reaching rescan; wrong dependency-type reasoning and wrong strategy, not
      merely a late-stage failure)
    Retry used: Yes
    Final outcome: Correct
    Version published: Yes
    Rescan passed: Yes
    Manual review flag: No
  Verdict: Pilot passes all four gate questions. The first-attempt/retry decomposition shows
    the final "Correct" result depends on the retry mechanism, not on one-shot unaided recall --
    this is now tracked explicitly per scenario going forward so hint-removal and retry-recovery
    are not read as a single combined effect.
