Known Issue -- Fixed-Version Leak via Retry Path (found and fixed after JS-05, JS-09):
  Cause: retry_remediation.py's _extract_rescan_summary() independently appended
    "Scanner-known fixed versions: [...]" to the retry's failure-context block whenever
    attempt 1's rescan ran and still detected the target CVE. This is a second,
    separate prompt-construction path that llm_reasoner.py's hint removal never touched.
  Trigger condition: only fires when attempt 1 gets far enough to run a rescan that still
    detects the CVE (test installs but doesn't fix it) -- not when attempt 1 fails earlier
    (e.g. at apply_fix, before rescan ever runs).
  Scope, verified directly against each scenario's actual retry prompt text (not inferred):
    JS-05: CLEAN. Attempt 1 failed at apply_fix, before rescan ever ran -- no rescan.json
      entry existed for _extract_rescan_summary to find, confirmed by grepping the actual
      llm-request.json retry prompt (no match).
    JS-09: CONTAMINATED. Attempt 1 reached a rescan that still detected the CVE, so the
      retry prompt received "Scanner-known fixed versions: ['2.1.1']" verbatim -- the same
      fix version the base pipeline's hint would have given. JS-09's "Correct" final
      outcome does not constitute evidence of unaided recovery and must be re-run before
      being used in any analysis. Evidence retained under
      results/execution_evidence_no_hint/JS-09/ for transparency, not deleted, but flagged
      contaminated and excluded from findings until rerun.
  Fix applied: retry_remediation.py's rescan-context message now reports only that the CVE
    is still detected (package/version), with the fixed-versions clause removed. The
    build-error-log retry path (_extract_build_errors) was not affected and needed no change.
  Action: JS-09 queued for rerun under the fixed code before proceeding to JS-01/AF-01.

